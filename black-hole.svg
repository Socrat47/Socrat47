<svg xmlns="http://www.w3.org/2000/svg" width="440" height="440" viewBox="0 0 440 440" role="img" aria-labelledby="title desc">
  <title id="title">Black hole terminal emblem</title>
  <desc id="desc">A dark event horizon surrounded by violet and cyan light, stars, and orbital lines.</desc>
  <defs>
    <radialGradient id="space"><stop stop-color="#15112c"/><stop offset=".68" stop-color="#0b1020"/><stop offset="1" stop-color="#070b16"/></radialGradient>
    <radialGradient id="halo"><stop offset=".25" stop-color="#070b16"/><stop offset=".43" stop-color="#5f42bb" stop-opacity=".26"/><stop offset=".62" stop-color="#9a6dff" stop-opacity=".13"/><stop offset="1" stop-color="#9a6dff" stop-opacity="0"/></radialGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#59e1f0"/><stop offset=".36" stop-color="#5b8dff"/><stop offset=".66" stop-color="#b56aff"/><stop offset="1" stop-color="#ff9fb7"/></linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9e6eff" stop-opacity="0"/><stop offset=".46" stop-color="#a878ff"/><stop offset=".74" stop-color="#65dce9"/><stop offset="1" stop-color="#65dce9" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="frame"><rect width="440" height="440" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="440" height="440" fill="url(#space)"/>
    <path d="M0 80H440M0 160H440M0 240H440M0 320H440M80 0V440M160 0V440M240 0V440M320 0V440M400 0V440" fill="none" stroke="#7282ac" stroke-opacity=".07"/>
    <circle cx="220" cy="220" r="180" fill="url(#halo)"/>
    <g fill="#a8bbec">
      <circle cx="57" cy="73" r="1.3"/><circle cx="358" cy="59" r="1"/><circle cx="395" cy="158" r="1.4"/><circle cx="70" cy="281" r="1"/><circle cx="360" cy="352" r="1.3"/><circle cx="116" cy="383" r="1.2"/><circle cx="38" cy="171" r=".8"/><circle cx="319" cy="98" r=".8"/><circle cx="401" cy="290" r=".9"/>
    </g>
    <g fill="none" stroke="#7fa8e9" stroke-opacity=".19">
      <ellipse cx="220" cy="220" rx="172" ry="88" transform="rotate(-23 220 220)"/>
      <ellipse cx="220" cy="220" rx="192" ry="108" transform="rotate(-23 220 220)" stroke-dasharray="2 8"/>
    </g>
    <ellipse cx="220" cy="220" rx="160" ry="53" transform="rotate(-23 220 220)" fill="none" stroke="url(#disk)" stroke-width="24" opacity=".35" filter="url(#blur)"/>
    <ellipse cx="220" cy="220" rx="157" ry="51" transform="rotate(-23 220 220)" fill="none" stroke="url(#disk)" stroke-width="7" opacity=".75"/>
    <ellipse cx="220" cy="220" rx="145" ry="45" transform="rotate(-23 220 220)" fill="none" stroke="url(#disk)" stroke-width="2" opacity=".95"/>
    <circle cx="220" cy="220" r="84" fill="#ab6cff" opacity=".3" filter="url(#blur)"/>
    <circle cx="220" cy="220" r="75" fill="#090b18" stroke="url(#disk)" stroke-width="7"/>
    <circle cx="220" cy="220" r="67" fill="#03050b"/>
    <path d="M72 278C119 271 153 245 170 231M271 196c39-27 76-49 103-48" fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M74 279c51-7 82-35 96-48M273 195c42-29 78-47 100-47" fill="none" stroke="url(#arc)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="87" cy="272" r="3" fill="#8ee8f4"/><circle cx="348" cy="159" r="2.5" fill="#d8a1ff"/>
    <path d="M20 25h40M20 25v20M420 25h-40M420 25v20M20 415h40M20 415v-20M420 415h-40M420 415v-20" fill="none" stroke="#9d80d8" stroke-opacity=".55" stroke-width="2"/>
    <text x="29" y="405" fill="#a8b8d9" font-family="monospace" font-size="11" letter-spacing="2">S47 / EVENT HORIZON</text>
    <text x="402" y="405" text-anchor="end" fill="#8c9bbb" font-family="monospace" font-size="11">01</text>
  </g>
